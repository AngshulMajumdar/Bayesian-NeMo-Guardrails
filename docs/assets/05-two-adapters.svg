<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="A single BayesianPolicy connects to LLMRails and IORails using two real adapters with different integration modes."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#F8E8D8"/></linearGradient><linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A22D51"/><stop offset="1" stop-color="#E57C3C"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53253B"/><stop offset="1" stop-color="#9C2C4F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="560" rx="25" fill="url(#bg)" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="11" rx="0" fill="url(#halo)" stroke="none" stroke-width="0"/><text x="50" y="57" fill="#8D2347" font-size="17" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">05   /   BAYESIAN NeMo</text><text x="50" y="115" fill="#271825" font-size="43" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">One Bayesian layer. Two NeMo engines.</text><rect x="48" y="132" width="108" height="5" rx="2" fill="#D96835" stroke="none" stroke-width="0"/><rect x="350" y="164" width="570" height="94" rx="23" fill="url(#dark)" stroke="none" stroke-width="0"/><text x="635" y="204" fill="#FFFFFF" font-size="31" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Shared BayesianPolicy</text><text x="635" y="237" fill="#FFE8DB" font-size="18" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Calibrated predictive risk + policy gates</text><line x1="635" y1="258" x2="635" y2="286" stroke="#8D2347" stroke-width="3"/><line x1="316" y1="286" x2="948" y2="286" stroke="#8D2347" stroke-width="3"/><line x1="316" y1="286" x2="316" y2="320" stroke="#8D2347" stroke-width="3"/><polygon points="316.0,320.0 309.5,308.7 322.5,308.7" fill="#8D2347"/><line x1="948" y1="286" x2="948" y2="320" stroke="#8D2347" stroke-width="3"/><polygon points="948.0,320.0 941.5,308.7 954.5,308.7" fill="#8D2347"/><rect x="76" y="323" width="487" height="177" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="93" y="340" width="7" height="35" rx="3" fill="#8D2347" stroke="none" stroke-width="0"/><text x="114" y="367" fill="#271825" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">LLMRailsAdapter</text><text x="100" y="408" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">External wrapper + optional Colang action</text><text x="100" y="437" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Trusted scores via action context</text><rect x="693" y="323" width="510" height="177" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="710" y="340" width="7" height="35" rx="3" fill="#D96835" stroke="none" stroke-width="0"/><text x="731" y="367" fill="#271825" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">IORailsAdapter</text><text x="717" y="408" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">External wrapper using public NeMo APIs</text><text x="717" y="437" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No native custom-action registration</text><text x="494" y="539" fill="#49303C" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Both paths preserve NeMo-native blocking.</text></svg>