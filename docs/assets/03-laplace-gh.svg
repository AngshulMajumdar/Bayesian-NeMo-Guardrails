<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Damped Newton fits local curvature; a one-dimensional quadrature evaluates posterior predictive risk."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#F8E8D8"/></linearGradient><linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A22D51"/><stop offset="1" stop-color="#E57C3C"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53253B"/><stop offset="1" stop-color="#9C2C4F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="560" rx="25" fill="url(#bg)" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="11" rx="0" fill="url(#halo)" stroke="none" stroke-width="0"/><text x="50" y="57" fill="#8D2347" font-size="17" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">03   /   BAYESIAN NeMo</text><text x="50" y="115" fill="#271825" font-size="43" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Fast by design: Laplace + Gauss–Hermite</text><rect x="48" y="132" width="108" height="5" rx="2" fill="#D96835" stroke="none" stroke-width="0"/><rect x="46" y="184" width="344" height="242" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="63" y="201" width="7" height="35" rx="3" fill="#D96835" stroke="none" stroke-width="0"/><text x="84" y="228" fill="#271825" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Offline calibration</text><text x="70" y="269" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Damped Newton iteration</text><text x="70" y="298" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Posterior mode + Hessian</text><text x="70" y="327" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Gaussian Laplace approximation</text><line x1="399" y1="295" x2="436" y2="295" stroke="#8D2347" stroke-width="3"/><polygon points="436.0,295.0 424.7,301.5 424.7,288.5" fill="#8D2347"/><rect x="442" y="184" width="348" height="242" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="459" y="201" width="7" height="35" rx="3" fill="#8D2347" stroke="none" stroke-width="0"/><text x="480" y="228" fill="#271825" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Project to one dimension</text><text x="466" y="269" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">m = x̃ᵀθ̂</text><text x="466" y="298" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">v = x̃ᵀH⁻¹x̃</text><text x="466" y="327" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Evaluate sigmoid under N(m, v)</text><line x1="797" y1="295" x2="828" y2="295" stroke="#8D2347" stroke-width="3"/><polygon points="828.0,295.0 816.7,301.5 816.7,288.5" fill="#8D2347"/><rect x="837" y="184" width="391" height="242" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="854" y="201" width="7" height="35" rx="3" fill="#256D58" stroke="none" stroke-width="0"/><text x="875" y="228" fill="#271825" font-size="25" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Deterministic quadrature</text><text x="861" y="269" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Gauss–Hermite nodes &amp; weights</text><text x="861" y="298" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Fast posterior-predictive score</text><text x="861" y="327" fill="#745C64" font-size="20" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Uncertainty-aware decision</text><text x="52" y="495" fill="#8D2347" font-size="23" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">No variational Bayes. No MCMC. No extra LLM call for the Bayesian decision layer.</text></svg>