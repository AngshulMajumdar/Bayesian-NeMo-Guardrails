<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Bayesian parameter uncertainty is integrated to predict policy-violation risk."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#F8E8D8"/></linearGradient><linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A22D51"/><stop offset="1" stop-color="#E57C3C"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53253B"/><stop offset="1" stop-color="#9C2C4F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="560" rx="25" fill="url(#bg)" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="11" rx="0" fill="url(#halo)" stroke="none" stroke-width="0"/><text x="50" y="57" fill="#8D2347" font-size="17" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">02   /   BAYESIAN NeMo</text><text x="50" y="115" fill="#271825" font-size="43" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Beyond one best-fit model</text><rect x="48" y="132" width="108" height="5" rx="2" fill="#D96835" stroke="none" stroke-width="0"/><rect x="48" y="170" width="515" height="305" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><text x="79" y="223" fill="#271825" font-size="27" font-weight="750" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The quantity we want</text><text x="83" y="286" fill="#8D2347" font-size="29" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">r(x) =  ∫  σ(θᵀx̃)  p(θ | D) dθ</text><text x="83" y="329" fill="#745C64" font-size="21" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">x̃ = [1, detector scores]</text><text x="83" y="380" fill="#49303C" font-size="20" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Integrate over plausible model parameters,</text><text x="83" y="411" fill="#49303C" font-size="20" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">not just a single fitted coefficient vector.</text><rect x="590" y="170" width="644" height="305" rx="22" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><text x="626" y="219" fill="#271825" font-size="25" font-weight="750" text-anchor="start" font-family="Arial, Helvetica, sans-serif">From posterior uncertainty to one decision</text><line x1="633" y1="400" x2="1184" y2="400" stroke="#271825" stroke-width="2"/><path d="M640 398 C723 397 757 393 804 327 C843 265 888 268 923 327 C961 395 1045 398 1176 398" stroke="#B96B89" stroke-width="5" fill="none" /><path d="M640 398 C724 396 748 365 786 313 C844 221 922 220 977 312 C1025 385 1070 398 1176 398" stroke="#D96835" stroke-width="5" fill="none" /><text x="739" y="440" fill="#A05974" font-size="19" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Earlier uncertainty</text><text x="1015" y="440" fill="#D96835" font-size="19" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Updated belief</text><text x="837" y="282" fill="#745C64" font-size="16" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Illustrative distributions</text><text x="50" y="512" fill="#49303C" font-size="20" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The posterior-predictive objective is Bayesian; its implemented numerical solvers are deterministic approximations.</text></svg>