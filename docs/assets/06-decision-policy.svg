<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="The application compares expected losses, checks uncertainty gates, and preserves hard vetoes."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#F8E8D8"/></linearGradient><linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A22D51"/><stop offset="1" stop-color="#E57C3C"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53253B"/><stop offset="1" stop-color="#9C2C4F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="560" rx="25" fill="url(#bg)" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="11" rx="0" fill="url(#halo)" stroke="none" stroke-width="0"/><text x="50" y="57" fill="#8D2347" font-size="17" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">06   /   BAYESIAN NeMo</text><text x="50" y="115" fill="#271825" font-size="43" font-weight="800" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Safety is not just a threshold</text><rect x="48" y="132" width="108" height="5" rx="2" fill="#D96835" stroke="none" stroke-width="0"/><rect x="52" y="178" width="405" height="292" rx="24" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><text x="82" y="229" fill="#271825" font-size="27" font-weight="750" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Bayesian decision rule</text><text x="81" y="289" fill="#8D2347" font-size="28" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">E[L(a,H) | x,D]</text><text x="81" y="338" fill="#49303C" font-size="21" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Pick the action with</text><text x="81" y="368" fill="#49303C" font-size="21" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">minimum expected loss.</text><text x="81" y="417" fill="#745C64" font-size="19" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Policy costs are YAML-configured.</text><line x1="464" y1="321" x2="520" y2="321" stroke="#8D2347" stroke-width="3"/><polygon points="520.0,321.0 508.7,327.5 508.7,314.5" fill="#8D2347"/><rect x="529" y="192" width="700" height="242" rx="24" fill="#FFFFFF" stroke="#E7CDBA" stroke-width="2"/><rect x="552" y="240" width="203" height="125" rx="20" fill="#E1F3EA" stroke="none" stroke-width="0"/><text x="653" y="286" fill="#256D58" font-size="24" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">ALLOW</text><text x="653" y="318" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Release only</text><text x="653" y="341" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">after native checks</text><rect x="780" y="240" width="203" height="125" rx="20" fill="#FFF0D4" stroke="none" stroke-width="0"/><text x="881" y="286" fill="#D96835" font-size="24" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">REVIEW</text><text x="881" y="318" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Withhold pending</text><text x="881" y="341" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">another decision</text><rect x="1008" y="240" width="203" height="125" rx="20" fill="#FAE2E3" stroke="none" stroke-width="0"/><text x="1109" y="286" fill="#8D2347" font-size="24" font-weight="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">BLOCK</text><text x="1109" y="318" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Do not</text><text x="1109" y="341" fill="#49303C" font-size="15" font-weight="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">release</text><text x="545" y="400" fill="#8D2347" font-size="20" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Hard veto or unknown evidence can prevent release.</text><text x="50" y="514" fill="#49303C" font-size="20" font-weight="500" text-anchor="start" font-family="Arial, Helvetica, sans-serif">The demonstration uses synthetic calibration; replace it with independent labels before production deployment.</text></svg>